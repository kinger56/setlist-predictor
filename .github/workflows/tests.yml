# Runs the test suite on every push and pull request.
# A green check next to your commits on GitHub means all tests passed.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Fails the build if tests cover less than 90% of the app code.
      - run: pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90
